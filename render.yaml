# Render Blueprint: New > Blueprint, pick this repo. Free plan; values marked sync: false
# are asked for once in the dashboard. See docs/deploy.md.
services:
  - type: web
    name: haq-api
    runtime: docker
    plan: free
    region: singapore
    # Paths are from the repo root; the image is built from server/ only.
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/v1/health
    autoDeploy: true
    # Client-only or docs-only pushes do not rebuild the API.
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: ENV
        value: prod
      - key: STORAGE
        value: postgres
      - key: EXTRACTOR
        value: tesseract
      - key: LOG_JSON
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_OPERATOR_PASSWORD
        sync: false
