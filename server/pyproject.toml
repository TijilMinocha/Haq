[project]
name = "haq-server"
version = "0.1.0"
description = "Haq API: finds unclaimed micro-insurance covers from a passbook"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "indic-transliteration>=2.3.82",
    "opencv-python-headless>=5.1.0.95",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pymupdf>=2.1",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF012"]  # pydantic models copy mutable defaults per instance

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pytesseract.*", "cv2.*", "pymupdf.*", "indic_transliteration.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.mypy.overrides]]
# pymupdf ships partial, untyped stubs; treat it as Any rather than leak untyped calls.
module = ["pymupdf", "pymupdf.*"]
follow_imports = "skip"
